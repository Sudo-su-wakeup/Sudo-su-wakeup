<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240" fill="none">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#101f42" />
      <stop offset="100%" stop-color="#1c3166" />
    </linearGradient>

    <!-- Mountain Gradient 1 -->
    <linearGradient id="mountGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1e" />
      <stop offset="100%" stop-color="#0c1733" />
    </linearGradient>

    <!-- Mountain Gradient 2 -->
    <linearGradient id="mountGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050914" />
      <stop offset="100%" stop-color="#081024" />
    </linearGradient>

    <!-- River/Light Reflection Gradient -->
    <linearGradient id="streamGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#4cc9f0" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4361ee" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0a1128" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="900" height="240" rx="8" fill="url(#skyGrad)" />

  <!-- Stars -->
  <circle cx="120" cy="45" r="1.2" fill="#ffffff" opacity="0.7" />
  <circle cx="280" cy="30" r="1" fill="#ffffff" opacity="0.5" />
  <circle cx="450" cy="25" r="1.5" fill="#ffffff" opacity="0.8" />
  <circle cx="620" cy="50" r="1" fill="#ffffff" opacity="0.6" />
  <circle cx="780" cy="35" r="1.3" fill="#ffffff" opacity="0.75" />
  <circle cx="840" cy="70" r="1" fill="#ffffff" opacity="0.4" />
  <circle cx="70" cy="90" r="1.2" fill="#ffffff" opacity="0.5" />
  <circle cx="340" cy="75" r="1" fill="#ffffff" opacity="0.6" />
  <circle cx="560" cy="65" r="1.2" fill="#ffffff" opacity="0.7" />

  <!-- Background Mountains -->
  <path d="M 0 160 Q 180 110 380 150 T 700 135 T 900 160 L 900 240 L 0 240 Z" fill="url(#mountGrad1)" opacity="0.9" />

  <!-- Flowing Light Stream / Winding River -->
  <path d="M 450 145 Q 460 170 435 190 T 475 220 T 450 240 L 440 240 Q 460 220 425 195 T 445 170 Z" fill="url(#streamGrad)" />

  <!-- Foreground Mountains -->
  <path d="M 0 185 Q 160 145 340 180 T 640 175 T 900 185 L 900 240 L 0 240 Z" fill="url(#mountGrad2)" />

  <!-- Text Header -->
  <!-- Centered Welcome Title -->
  <text x="450" y="98" 
        text-anchor="middle" 
        fill="#e2e8f0" 
        font-family="'Fira Code', 'Courier New', monospace" 
        font-size="22" 
        font-weight="500" 
        letter-spacing="2">
    Welcome to Manish's Github
  </text>

  <!-- Centered Code Brackets </> -->
  <text x="450" y="125" 
        text-anchor="middle" 
        fill="#70d6ff" 
        font-family="'Fira Code', 'Courier New', monospace" 
        font-size="18" 
        font-weight="600" 
        letter-spacing="3"
        filter="url(#softGlow)">
    &lt;/&gt;
  </text>
</svg>
