<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="280">
  <defs>
    <style>
      @keyframes pulse-cyan {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #00f3ff); }
        50% { opacity: 0.6; filter: drop-shadow(0 0 18px #00f3ff); }
      }
      @keyframes pulse-purple {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #bd00ff); }
        50% { opacity: 0.6; filter: drop-shadow(0 0 18px #bd00ff); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(900%); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes rotateBorder {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -800; }
      }
      @keyframes fadeInUp {
        0% { opacity: 0; transform: translateY(20px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes glitch {
        0%, 90%, 100% { transform: skewX(0deg); opacity: 1; }
        92% { transform: skewX(-4deg); opacity: 0.8; }
        94% { transform: skewX(3deg); opacity: 0.9; }
        96% { transform: skewX(-2deg); opacity: 1; }
      }
      @keyframes cornerBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      .title-text { animation: glitch 6s infinite; }
      .cyan-glow { animation: pulse-cyan 2s ease-in-out infinite; }
      .purple-glow { animation: pulse-purple 2.5s ease-in-out infinite; }
      .float-el { animation: float 3s ease-in-out infinite; }
      .scanline-el { animation: scanline 4s linear infinite; }
      .blink-el { animation: blink 1.2s step-end infinite; }
      .border-animate { animation: rotateBorder 3s linear infinite; }
      .corner-anim { animation: cornerBlink 1.5s ease-in-out infinite; }
    </style>

    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020510"/>
      <stop offset="40%" stop-color="#050a1a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Cyan Neon Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#0080ff"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bd00ff"/>
    </linearGradient>

    <!-- 3D Perspective Gradient -->
    <linearGradient id="perspGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid3d" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0e2040" stroke-width="0.8"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="900" height="280" fill="url(#bgGrad)" rx="8"/>
  <rect width="900" height="280" fill="url(#grid3d)" rx="8" opacity="0.5"/>

  <!-- 3D Perspective Grid Floor -->
  <g opacity="0.3">
    <line x1="450" y1="200" x2="0" y2="280" stroke="#00f3ff" stroke-width="0.5"/>
    <line x1="450" y1="200" x2="100" y2="280" stroke="#00f3ff" stroke-width="0.5"/>
    <line x1="450" y1="200" x2="200" y2="280" stroke="#00f3ff" stroke-width="0.5"/>
    <line x1="450" y1="200" x2="300" y2="280" stroke="#00f3ff" stroke-width="0.5"/>
    <line x1="450" y1="200" x2="400" y2="280" stroke="#00f3ff" stroke-width="0.5"/>
    <line x1="450" y1="200" x2="500" y2="280" stroke="#00f3ff" stroke-width="0.5"/>
    <line x1="450" y1="200" x2="600" y2="280" stroke="#00f3ff" stroke-width="0.5"/>
    <line x1="450" y1="200" x2="700" y2="280" stroke="#00f3ff" stroke-width="0.5"/>
    <line x1="450" y1="200" x2="800" y2="280" stroke="#00f3ff" stroke-width="0.5"/>
    <line x1="450" y1="200" x2="900" y2="280" stroke="#00f3ff" stroke-width="0.5"/>
    <!-- Horizontal lines -->
    <line x1="0" y1="240" x2="900" y2="240" stroke="#00f3ff" stroke-width="0.5"/>
    <line x1="0" y1="260" x2="900" y2="260" stroke="#00f3ff" stroke-width="0.5"/>
    <line x1="0" y1="275" x2="900" y2="275" stroke="#00f3ff" stroke-width="0.5"/>
    <line x1="90" y1="220" x2="810" y2="220" stroke="#00f3ff" stroke-width="0.5"/>
    <line x1="170" y1="208" x2="730" y2="208" stroke="#00f3ff" stroke-width="0.5"/>
  </g>

  <!-- Scanline Effect -->
  <rect class="scanline-el" x="0" y="0" width="900" height="8" fill="url(#cyanGrad)" opacity="0.04" rx="0"/>

  <!-- Animated Border -->
  <rect x="2" y="2" width="896" height="276" rx="7" fill="none"
        stroke="#00f3ff" stroke-width="1.5" stroke-dasharray="200 600"
        class="border-animate" opacity="0.8"/>
  <rect x="2" y="2" width="896" height="276" rx="7" fill="none"
        stroke="#bd00ff" stroke-width="1.5" stroke-dasharray="200 600" stroke-dashoffset="400"
        class="border-animate" opacity="0.8"/>

  <!-- Corner Accents — Top Left -->
  <g class="cyan-glow corner-anim">
    <path d="M 16 50 L 16 16 L 50 16" fill="none" stroke="#00f3ff" stroke-width="2.5"/>
    <circle cx="16" cy="16" r="3" fill="#00f3ff"/>
  </g>
  <!-- Corner — Top Right -->
  <g class="purple-glow corner-anim">
    <path d="M 850 16 L 884 16 L 884 50" fill="none" stroke="#bd00ff" stroke-width="2.5"/>
    <circle cx="884" cy="16" r="3" fill="#bd00ff"/>
  </g>
  <!-- Corner — Bottom Left -->
  <g class="purple-glow corner-anim">
    <path d="M 16 230 L 16 264 L 50 264" fill="none" stroke="#bd00ff" stroke-width="2.5"/>
    <circle cx="16" cy="264" r="3" fill="#bd00ff"/>
  </g>
  <!-- Corner — Bottom Right -->
  <g class="cyan-glow corner-anim">
    <path d="M 850 264 L 884 264 L 884 230" fill="none" stroke="#00f3ff" stroke-width="2.5"/>
    <circle cx="884" cy="264" r="3" fill="#00f3ff"/>
  </g>

  <!-- Status Bar -->
  <g font-family="'Courier New', monospace" font-size="10" letter-spacing="1.5">
    <text x="30" y="38" fill="#00f3ff" opacity="0.9">SYS:ONLINE</text>
    <text x="115" y="38" fill="#1a3a5c">|</text>
    <text x="125" y="38" fill="#6c7d9c">NODE:CLOUD-DEVOPS</text>
    <text x="270" y="38" fill="#1a3a5c">|</text>
    <text x="280" y="38" fill="#bd00ff" opacity="0.9">MODE:ACTIVE</text>
    <!-- Blinking dot -->
    <circle cx="378" cy="34" r="3.5" fill="#00ff88" class="blink-el"/>
  </g>
  <line x1="25" y1="44" x2="875" y2="44" stroke="#0e2040" stroke-width="1"/>

  <!-- Central Floating 3D Card Element -->
  <g class="float-el">
    <!-- Card shadow -->
    <rect x="180" y="72" width="540" height="118" rx="10"
          fill="#00f3ff" opacity="0.04"/>
    <!-- Main card -->
    <rect x="175" y="68" width="540" height="118" rx="10"
          fill="#060d1e" stroke="#0d2444" stroke-width="1.5" opacity="0.95"/>
    <!-- Top highlight -->
    <rect x="175" y="68" width="540" height="4" rx="2" fill="url(#titleGrad)" opacity="0.6"/>
  </g>

  <!-- Main Title -->
  <g class="title-text float-el">
    <text x="446" y="120"
          text-anchor="middle"
          font-family="'Segoe UI', -apple-system, sans-serif"
          font-size="42" font-weight="900"
          fill="url(#titleGrad)"
          letter-spacing="3"
          filter="url(#glow-strong)">
      SUDO-SU-WAKEUP
    </text>
  </g>

  <!-- Subtitle inside card -->
  <g class="float-el">
    <rect x="230" y="130" width="430" height="26" rx="5" fill="#0a1930" stroke="#0d2a50" stroke-width="1"/>
    <text x="445" y="148"
          text-anchor="middle"
          font-family="'Courier New', monospace"
          font-size="13" font-weight="600"
          fill="#00f3ff" letter-spacing="1.5">
      &gt; ASPIRING CLOUD &amp; DEVOPS ENGINEER
    </text>
  </g>

  <!-- Bottom Status Row -->
  <g font-family="'Courier New', monospace" font-size="10" letter-spacing="1">
    <circle cx="32" cy="190" r="4" fill="#00f3ff" class="blink-el" filter="url(#glow-cyan)"/>
    <text x="42" y="194" fill="#00f3ff">TARGET:</text>
    <text x="105" y="194" fill="#c9d1d9">LINUX</text>
    <text x="152" y="194" fill="#1a3a5c">·</text>
    <text x="162" y="194" fill="#c9d1d9">BASH</text>
    <text x="202" y="194" fill="#1a3a5c">·</text>
    <text x="212" y="194" fill="#c9d1d9">AWS</text>
    <text x="246" y="194" fill="#1a3a5c">·</text>
    <text x="256" y="194" fill="#c9d1d9">DOCKER</text>
    <text x="312" y="194" fill="#1a3a5c">·</text>
    <text x="322" y="194" fill="#c9d1d9">TERRAFORM</text>
    <text x="407" y="194" fill="#1a3a5c">·</text>
    <text x="417" y="194" fill="#c9d1d9">KUBERNETES</text>
    <text x="514" y="194" fill="#1a3a5c">·</text>
    <text x="524" y="194" fill="#c9d1d9">CI/CD</text>
    <!-- MCA Badge -->
    <rect x="620" y="181" width="240" height="18" rx="3" fill="#0f1a30" stroke="#bd00ff" stroke-width="1"/>
    <text x="740" y="194" text-anchor="middle" fill="#bd00ff" font-size="9.5" font-weight="bold">
      FINAL-YEAR MCA · CLOUD COMPUTING
    </text>
  </g>
</svg>
