<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 240" width="100%" height="240" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#060810" />
    </linearGradient>

    <!-- Neon Cyan-Purple Accent Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#bd00ff" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#0e1b30" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Container Base -->
  <rect width="950" height="240" rx="10" fill="url(#bgGradient)" stroke="#1a2744" stroke-width="1.5" />
  
  <!-- Cyber Grid Overlay -->
  <rect width="950" height="240" rx="10" fill="url(#cyberGrid)" />

  <!-- Cyberpunk Corner Accents -->
  <!-- Top Left Corner -->
  <path d="M 16 35 L 16 16 L 35 16" fill="none" stroke="#00f3ff" stroke-width="2.5" filter="url(#neonGlow)" />
  <circle cx="16" cy="16" r="2" fill="#00f3ff" />
  <!-- Top Right Corner -->
  <path d="M 915 16 L 934 16 L 934 35" fill="none" stroke="#bd00ff" stroke-width="2.5" filter="url(#neonGlow)" />
  <circle cx="934" cy="16" r="2" fill="#bd00ff" />
  <!-- Bottom Left Corner -->
  <path d="M 16 205 L 16 224 L 35 224" fill="none" stroke="#bd00ff" stroke-width="2.5" filter="url(#neonGlow)" />
  <circle cx="16" cy="224" r="2" fill="#bd00ff" />
  <!-- Bottom Right Corner -->
  <path d="M 915 224 L 934 224 L 934 205" fill="none" stroke="#00f3ff" stroke-width="2.5" filter="url(#neonGlow)" />
  <circle cx="934" cy="224" r="2" fill="#00f3ff" />

  <!-- Top System Status Bar -->
  <g font-family="'Fira Code', 'Courier New', monospace" font-size="11" letter-spacing="1.5">
    <text x="45" y="42" fill="#00f3ff" opacity="0.9">// PROTOCOL: SSH-SECURE</text>
    <text x="320" y="42" fill="#6c7d9c">|</text>
    <text x="350" y="42" fill="#bd00ff" opacity="0.9">SYSTEM STATUS: OPERATIONAL [ONLINE]</text>
    <text x="710" y="42" fill="#6c7d9c">|</text>
    <text x="740" y="42" fill="#00f3ff" opacity="0.9">NODE: CLOUD-DEVOPS-LAB</text>
  </g>

  <!-- Horizontal Tech Divider -->
  <line x1="45" y1="56" x2="905" y2="56" stroke="url(#neonGrad)" stroke-width="1.2" opacity="0.8" />

  <!-- Main Cyberpunk Handle / Callout -->
  <g font-family="'Segoe UI', -apple-system, 'SF Pro Display', Roboto, sans-serif">
    <text x="45" y="112" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="2">
      SUDO-SU-<tspan fill="#00f3ff">WAKEUP</tspan>
    </text>
  </g>

  <!-- Subtitle / Role -->
  <g font-family="'Fira Code', 'Courier New', monospace" font-size="15" font-weight="600" letter-spacing="1">
    <rect x="45" y="132" width="460" height="26" rx="4" fill="#0f192e" stroke="#00f3ff" stroke-width="1" opacity="0.9" />
    <text x="58" y="150" fill="#00f3ff">&gt; ASPIRING CLOUD &amp; DEVOPS ENGINEER</text>
    <text x="525" y="150" fill="#9daac2">| FINAL-YEAR MCA (CLOUD COMPUTING)</text>
  </g>

  <!-- Bottom Terminal Tagline & Focus Stack -->
  <g font-family="'Fira Code', 'Courier New', monospace" font-size="11" letter-spacing="1">
    <line x1="45" y1="180" x2="905" y2="180" stroke="#162544" stroke-width="1" />
    
    <!-- Pulse Indicator -->
    <circle cx="52" cy="202" r="4" fill="#00f3ff" filter="url(#neonGlow)" />
    <text x="66" y="206" fill="#00f3ff" font-weight="bold">TARGET STACK:</text>
    
    <text x="180" y="206" fill="#e0e6ed">LINUX</text>
    <text x="235" y="206" fill="#6c7d9c">•</text>
    <text x="255" y="206" fill="#e0e6ed">BASH</text>
    <text x="305" y="206" fill="#6c7d9c">•</text>
    <text x="325" y="206" fill="#e0e6ed">AWS</text>
    <text x="365" y="206" fill="#6c7d9c">•</text>
    <text x="385" y="206" fill="#e0e6ed">DOCKER</text>
    <text x="450" y="206" fill="#6c7d9c">•</text>
    <text x="470" y="206" fill="#e0e6ed">TERRAFORM</text>
    <text x="560" y="206" fill="#6c7d9c">•</text>
    <text x="580" y="206" fill="#e0e6ed">KUBERNETES</text>
    <text x="680" y="206" fill="#6c7d9c">•</text>
    <text x="700" y="206" fill="#e0e6ed">CI/CD</text>

    <!-- Mode Badge Right -->
    <rect x="800" y="193" width="105" height="20" rx="3" fill="#1b1133" stroke="#bd00ff" stroke-width="1" />
    <text x="814" y="207" fill="#bd00ff" font-size="10" font-weight="bold">SYS_ACTIVE</text>
  </g>
</svg>
