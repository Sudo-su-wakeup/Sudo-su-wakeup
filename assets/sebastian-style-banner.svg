<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" width="100%" height="200">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020908" />
      <stop offset="50%" stop-color="#051210" />
      <stop offset="100%" stop-color="#020908" />
    </linearGradient>

    <!-- Circuit Pattern -->
    <pattern id="circuitGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0 20 L 15 20 L 25 10 L 40 10 M 20 0 L 20 15 L 30 25 L 30 40 M 10 40 L 10 30 L 0 20" fill="none" stroke="#00e676" stroke-width="0.8" opacity="0.18"/>
      <circle cx="15" cy="20" r="1.5" fill="#00e676" opacity="0.3"/>
      <circle cx="25" cy="10" r="1.5" fill="#00e676" opacity="0.3"/>
      <circle cx="30" cy="25" r="1.5" fill="#00e676" opacity="0.3"/>
    </pattern>

    <!-- Monitor Gradients -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c3a" />
      <stop offset="100%" stop-color="#090d1f" />
    </linearGradient>

    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Card -->
  <rect width="920" height="200" rx="10" fill="url(#bgDark)" stroke="#093829" stroke-width="2"/>
  <rect width="920" height="200" rx="10" fill="url(#circuitGrid)"/>

  <!-- Left Side: Stylized Computer Monitor (matches Sebastian reference icon) -->
  <g transform="translate(45, 25)">
    <!-- Stand -->
    <rect x="70" y="125" width="20" height="22" fill="#718096" rx="2"/>
    <ellipse cx="80" cy="148" rx="35" ry="5" fill="#4a5568"/>

    <!-- Screen Bezel -->
    <rect x="10" y="10" width="140" height="115" rx="7" fill="#6c5ce7" stroke="#a29bfe" stroke-width="2.5"/>
    <rect x="18" y="18" width="124" height="99" rx="4" fill="url(#screenGrad)"/>

    <!-- Code Editor Window header dots -->
    <circle cx="27" cy="26" r="2.5" fill="#ff5f56"/>
    <circle cx="34" cy="26" r="2.5" fill="#ffbd2e"/>
    <circle cx="41" cy="26" r="2.5" fill="#27c93f"/>

    <!-- Code lines inside monitor -->
    <!-- Line 1 -->
    <rect x="27" y="36" width="30" height="6" rx="2" fill="#ff7675"/>
    <rect x="62" y="36" width="22" height="6" rx="2" fill="#fdcb6e"/>
    <rect x="88" y="36" width="35" height="6" rx="2" fill="#55efc4"/>

    <!-- Line 2: Big Code brackets </> -->
    <text x="32" y="76" font-family="'Courier New', monospace" font-size="28" font-weight="900" fill="#00f3ff" filter="url(#neonGlow)">&lt;/&gt;</text>

    <!-- Line 3 syntax bars -->
    <rect x="27" y="88" width="24" height="6" rx="2" fill="#a29bfe"/>
    <rect x="56" y="88" width="40" height="6" rx="2" fill="#fd79a8"/>
    <rect x="100" y="88" width="20" height="6" rx="2" fill="#00cec9"/>
    <rect x="27" y="99" width="48" height="5" rx="2" fill="#74b9ff"/>
    <rect x="80" y="99" width="32" height="5" rx="2" fill="#ffeaa7"/>
  </g>

  <!-- Right Side: Name & Subtitle Typography -->
  <g transform="translate(235, 30)">
    <!-- Main Name -->
    <text x="0" y="75" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="1.5">
      Manish Yadav
    </text>

    <!-- Subtitle (Directly matching reference format: Role | Focus | Specialization) -->
    <text x="3" y="115" font-family="'Segoe UI', -apple-system, sans-serif" font-size="16.5" font-weight="600" fill="#a0aec0" letter-spacing="0.5">
      <tspan fill="#00e676">Cloud Computing</tspan> | <tspan fill="#00f3ff">DevOps &amp; Infrastructure</tspan> | <tspan fill="#ffffff">Linux &amp; Automation</tspan>
    </text>

    <!-- Accent Circuit line under text -->
    <path d="M 0 135 L 380 135 L 400 145 L 630 145" fill="none" stroke="#00e676" stroke-width="1.8" opacity="0.6"/>
    <circle cx="630" cy="145" r="3" fill="#00f3ff" filter="url(#neonGlow)"/>
  </g>
</svg>
